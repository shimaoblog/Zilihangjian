name: Auto Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser xmlbuilder

      - name: Run RSS aggregator
        run: node rss-aggregator.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 只添加目标文件
          git add data/posts.json feed.xml

          # 检查是否有变更
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            git commit -m "Auto update RSS & posts data"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes, skipping commit/push"
            exit 0
          fi
