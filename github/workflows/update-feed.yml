name: Auto Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动抓取一次
  workflow_dispatch:       # 支持手动点击运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser xmlbuilder

      - name: Run RSS aggregator
        run: node rss-aggregator.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 1. 先创建目录，避免文件不存在报错
          mkdir -p data

          # 2. 确保目标文件存在，不存在就创建空文件
          if [ ! -f "data/posts.json" ]; then
            echo "{}" > data/posts.json
          fi
          if [ ! -f "feed.xml" ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?><rss version="2.0"></rss>' > feed.xml
          fi

          # 3. 只添加我们要提交的文件，其他文件一概不管
          git add data/posts.json feed.xml

          # 4. 关键：用 --allow-empty 让 commit 即使没变更也不报错
          git commit -m "Auto update RSS & posts data" --allow-empty

          # 5. 拉取并推送
          git pull --rebase origin main
          git push origin main

      - name: Clean up (可选，避免文件残留影响后续构建)
        run: |
          rm -rf node_modules package-lock.json package.json
