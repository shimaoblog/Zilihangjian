name: Auto Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动抓取一次
  workflow_dispatch:       # 支持手动点击运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser xmlbuilder

      - name: Run RSS aggregator
        run: node rss-aggregator.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # 只添加我们要提交的两个文件
          git add data/posts.json feed.xml

          # 检查是否有变更，有变更才提交，没有就直接跳过
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          else
            git commit -m "Auto update RSS & posts data"
            git pull --rebase origin main
            git push origin main
          fi
