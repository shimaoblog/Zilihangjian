name: Auto Update RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动抓取一次
  workflow_dispatch:       # 支持手动点击运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser xmlbuilder

      - name: Run RSS aggregator
        run: node rss-aggregator.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # 只添加我们需要的两个文件，忽略其他文件
          git add data/posts.json feed.xml
          # 提交，如果没有变更就跳过提交
          git commit -m "Auto update RSS & posts data" || echo "No changes to commit, skipping push"
          # 拉取远程最新代码，解决冲突
          git pull --rebase origin main
          # 推送代码
          git push
