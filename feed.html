<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章聚合 | 字里行间</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .article-item{
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .article-meta{
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0.5rem 0;
        }
        .article-title{
            font-size: 1.4rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="sticky top-0 z-50 py-4">
    <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center space-x-2">
            <i class="fas fa-feather-alt text-2xl" style="color: var(--primary);"></i>
            <span class="title-font text-2xl">字里行间</span>
        </a>
        <div class="hidden md:flex items-center space-x-8">
            <a href="index.html" class="nav-link">首页</a>
            <a href="members.html" class="nav-link">博主们</a>
            <a href="feed.html" class="nav-link" style="color: var(--primary); border-bottom: 2px solid var(--primary);">文章</a>
            <a href="guestbook.html" class="nav-link">留言板</a>
            <a href="join.html" class="btn-primary">申请入驻</a>
        </div>
        <button class="md:hidden text-xl" id="mobile-menu-btn">
            <i class="fas fa-bars"></i>
        </button>
        <div class="mobile-menu" id="mobile-menu">
            <a href="index.html">首页</a>
            <a href="members.html">博主们</a>
            <a href="feed.html">文章</a>
            <a href="guestbook.html">留言板</a>
            <a href="join.html" class="btn-primary" style="margin: 0.5rem 2rem; text-align: center;">申请入驻</a>
        </div>
    </div>
</nav>

<section class="py-16">
    <div class="max-w-4xl mx-auto px-4">
        <h1 class="section-title title-font text-4xl mb-4 text-center">全部文章</h1>
        <p class="text-center handwritten text-xl mb-12 opacity-70">来自各位博主的最新文字</p>

        <div id="article-list">
            <div class="text-center py-10">加载中...</div>
        </div>

        <div class="text-center mt-10">
            <a href="feed.xml" class="btn-outline">
                <i class="fas fa-rss mr-2"></i> 订阅全站 RSS
            </a>
        </div>
    </div>
</section>

<!-- 页脚 -->
<footer class="py-12 mt-auto">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex flex-col md:flex-row justify-between items-center">
            <div class="mb-6 md:mb-0">
                <div class="flex items-center space-x-2 mb-2">
                    <i class="fas fa-feather-alt text-xl" style="color: var(--accent);"></i>
                    <span class="title-font text-xl">字里行间</span>
                </div>
                <p class="opacity-70">用文字连接彼此</p>
            </div>
            <div class="flex space-x-6">
                <a href="https://github.com/shimaoblog/Zilihangjian" class="opacity-70 hover:opacity-100 text-xl">
                    <i class="fab fa-github"></i>
                </a>
                <a href="feed.xml" class="opacity-70 hover:opacity-100 text-xl">
                    <i class="fas fa-rss"></i>
                </a>
            </div>
        </div>
        <div class="text-center mt-8 pt-8 border-t border-gray-700 opacity-60">
            <p>© 2026 字里行间 · 用心写，慢慢读</p>
        </div>
    </div>
</footer>

<script src="js/main.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
