name: Auto Update RSS Feed
# 授予写入仓库权限（解决git push 403）
permissions:
  contents: write

# 并发控制，避免多任务同时提交冲突
concurrency:
  group: rss-auto-update
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时抓取
  workflow_dispatch:       # 手动运行
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，防止推送失败

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # 缓存依赖加速

      - name: Install dependencies
        run: npm install rss-parser xmlbuilder

      - name: Run RSS aggregator
        run: node rss-aggregator.js

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json feed.xml
          # 无文件变更直接退出，不生成空commit
          if git diff --staged --quiet; then
            echo "No RSS data changes, skip commit"
            exit 0
          fi
          git commit -m "Auto update RSS & posts data"
          git push origin main
